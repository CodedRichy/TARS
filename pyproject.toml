[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tars-agent"
version = "0.1.0"
description = "The first AI agent with a brain you can watch grow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Rishi Praseeth Krishnan", email = "praseeth.edocs@gmail.com" },
]
keywords = ["ai", "agent", "self-improving", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "litellm>=1.40",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "watchdog>=4.0",
    "croniter>=2.0",
    "imapclient>=3.0",
    "python-ulid>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
]
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
tars = "tars.cli.app:main"

[project.urls]
Homepage = "https://github.com/rishi/TARS"
Repository = "https://github.com/rishi/TARS"

[tool.hatch.build.targets.wheel]
packages = ["src/tars"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
